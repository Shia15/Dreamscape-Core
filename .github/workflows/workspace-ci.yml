name: Workspace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_all:
    runs-on: ubuntu-latest
    env:
      WS_CONFIG: workspace/config/aether-workspace.json

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 18.20.8 (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.8
          cache: npm

      - name: Install manager deps
        run: npm ci

      - name: Check workspace config
        id: ws
        shell: bash
        run: |
          echo "Looking for $WS_CONFIG"
          if [ -f "$WS_CONFIG" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Found."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Not found. Listing dir:"
            ls -la "$(dirname "$WS_CONFIG")" || true
            ls -la
          fi

      - name: Clone all repos
        if: ${{ steps.ws.outputs.present == 'true' }}
        run: npm run workspace:clone-all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install all repo deps
        if: ${{ steps.ws.outputs.present == 'true' }}
        run: npm run workspace:install-all

      - name: Build all
        if: ${{ steps.ws.outputs.present == 'true' }}
        run: npm run workspace:build-all

      - name: Test all
        if: ${{ steps.ws.outputs.present == 'true' }}
        run: npm run workspace:test-all

      - name: Skip workspace build (config missing)
        if: ${{ steps.ws.outputs.present != 'true' }}
        run: "echo \"Skipping workspace build: $WS_CONFIG not found.\""

  guard_workflows:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
      - name: Block workflow edits without label
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.base_ref }}"
          git fetch --no-tags --prune --depth=1 origin "$BASE"
          CHANGED=$(git diff --name-only "origin/$BASE"...HEAD | grep '^.github/workflows/' || true)
          if [ -z "$CHANGED" ]; then
            echo "No workflow changes."
            exit 0
          fi
          HAS_LABEL=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" | grep -Fx 'allow-workflow-change' || true)
          [ -n "$HAS_LABEL" ] && { echo "override label present"; exit 0; }
          echo "Workflows changed. Add label: allow-workflow-change"; exit 1
