name: Node.js CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🔍 Check for package-lock.json
        run: |
          if [ -f package-lock.json ]; then
            echo "✅ Lock file found – proceeding with npm ci"
          else
            echo "⚠️ Lock file NOT found – continuing anyway"
          fi

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Build project
        run: |
          if [ -f package.json ]; then
            echo "📦 Running npm build..."
            npm run build
          else
            echo "⚠️ No package.json found – skipping build step"
          fi

      - name: ✅ Symbolic CI Complete
        run: |
          echo "🧬 CI completed by ${{ github.actor }} on branch ${{ github.ref }}"
          echo "🎯 Node version: ${{ matrix.node-version }}"
          echo "🕒 Completed at $(date)"
