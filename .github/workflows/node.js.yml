name: Node.js CI (locked)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pin actions to @v4 now; later you can replace @v4 with a commit SHA
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18.20.8 (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.8
          cache: npm

      - name: Verify lockfile present
        run: test -f package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build (if present)
        run: npm run build --if-present

      - name: Test (if present)
        run: npm test --if-present

  # FAIL PRs that edit workflow files unless a special label is present
  guard_workflows:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block workflow edits without label
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.base_ref }}"
          git fetch --no-tags --prune --depth=1 origin "$BASE"
          CHANGED=$(git diff --name-only "origin/$BASE"...HEAD | grep '^.github/workflows/' || true)

          if [ -z "$CHANGED" ]; then
            echo "No workflow changes."
            exit 0
          fi

          echo "Detected workflow changes:"
          echo "$CHANGED"
          echo

          # Read labels from the PR event payload
          HAS_LABEL=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" | grep -Fx 'allow-workflow-change' || true)
          if [ -n "$HAS_LABEL" ]; then
            echo "override label 'allow-workflow-change' present; allowing."
            exit 0
          fi

          echo "Workflows changed. Add PR label: allow-workflow-change"
          exit 1


